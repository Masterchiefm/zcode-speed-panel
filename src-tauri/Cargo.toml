[package]
name = "zcode-speed-panel"
version = "0.4.5"
description = "ZCode 输出速度仪表盘（托盘常驻）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# 应用内更新：同步阻塞式 HTTP 客户端（rustls，无 OpenSSL 依赖，mac 交叉构建友好）
ureq = { version = "2", features = ["json"] }

# 自动启动（autostart.rs）：HKCU Run 注册表读写，仅 Windows
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
strip = true
